<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fintech Solutions | QuantParticle</title>
    <link rel="icon" href="/quant_particle_logo_fevicon.png" type="image/png" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <style>
        :root {
            --bg-deep: #070b14;
            --bg-surface: #0f1525;
            --bg-elevated: #141d2e;
            --text-primary: #e8ecf1;
            --text-secondary: #8b95a8;
            --accent-cyan: #00e5ff;
            --accent-blue: #4f46e5;
            --accent-purple: #7c3aed;
            --border-subtle: rgba(255, 255, 255, 0.06);
            --border-glow: rgba(0, 229, 255, 0.15);
            --glass-bg: rgba(15, 21, 37, 0.6);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            min-width: 0;
        }

        html {
            scroll-behavior: smooth;
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
        }

        body {
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
            background-color: var(--bg-deep);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            line-height: 1.6;
            position: relative;
        }

        img,
        svg,
        canvas,
        video {
            max-width: 100%;
            display: block;
        }

        .cursor-glow {
            position: fixed;
            width: 20px;
            height: 20px;
            border: 2px solid var(--accent-cyan);
            border-radius: 50%;
            pointer-events: none;
            z-index: 99999;
            transform: translate(-50%, -50%);
            transition: width 0.2s, height 0.2s, background 0.2s;
            mix-blend-mode: difference;
        }

        .cursor-glow.hover {
            width: 50px;
            height: 50px;
            background: rgba(0, 229, 255, 0.1);
        }

        .cursor-trail {
            position: fixed;
            width: 6px;
            height: 6px;
            background: var(--accent-cyan);
            border-radius: 50%;
            pointer-events: none;
            z-index: 99998;
            transform: translate(-50%, -50%);
            opacity: 0.5;
            transition: opacity 0.5s;
        }

        .noise-overlay {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        #particle-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .scroll-progress {
            position: fixed;
            top: 0;
            left: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-blue));
            z-index: 10001;
            width: 0%;
            transition: width 0.1s;
        }

        .glow-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            pointer-events: none;
            z-index: 0;
            opacity: 0.12;
            max-width: none;
        }

        .glow-orb-1 {
            width: 400px;
            height: 400px;
            background: var(--accent-blue);
            top: 10%;
            left: -10%;
            animation: orbFloat 20s ease-in-out infinite;
        }

        .glow-orb-2 {
            width: 300px;
            height: 300px;
            background: var(--accent-cyan);
            bottom: 20%;
            right: -5%;
            animation: orbFloat 25s ease-in-out infinite reverse;
        }

        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(50px, -50px) scale(1.1); }
            66% { transform: translate(-30px, 30px) scale(0.9); }
        }

        header,
        main,
        footer,
        section,
        .container,
        .nav-container,
        .stats-bar,
        .services-grid,
        .approach-grid,
        .footer-grid,
        .serve-tags,
        .mobile-menu,
        .topic-row,
        .topic-content,
        .topic-visual {
            width: 100%;
            max-width: 100%;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(7, 11, 20, 0.72);
            backdrop-filter: blur(20px) saturate(1.8);
            border-bottom: 1px solid var(--border-subtle);
            z-index: 1000;
            transition: all 0.3s ease;
        }

        header.scrolled {
            background: rgba(7, 11, 20, 0.92);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
        }

        .nav-container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 1.15rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 88px;
            gap: 1rem;
            position: relative;
        }

        .logo {
            display: flex;
            align-items: center;
            text-decoration: none;
            min-width: 0;
            flex: 0 1 auto;
            position: relative;
            isolation: isolate;
        }

        .logo::before {
            content: '';
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 229, 255, 0.28) 0%, rgba(79, 70, 229, 0.18) 38%, rgba(124, 58, 237, 0.08) 60%, transparent 75%);
            filter: blur(18px);
            opacity: 0.95;
            pointer-events: none;
            z-index: -1;
            animation: logoGlowPulse 3.6s ease-in-out infinite;
        }

        .logo img {
            height: 64px;
            width: auto;
            position: relative;
            z-index: 2;
            filter: drop-shadow(0 0 18px rgba(0, 229, 255, 0.55));
            animation: logoPulse 3s ease-in-out infinite;
        }

        @keyframes logoPulse {
            0%, 100% { filter: drop-shadow(0 0 15px rgba(0, 229, 255, 0.4)); }
            50% { filter: drop-shadow(0 0 25px rgba(0, 229, 255, 0.75)); }
        }

        @keyframes logoGlowPulse {
            0%, 100% { opacity: 0.85; transform: translateY(-50%) scale(1); }
            50% { opacity: 1; transform: translateY(-50%) scale(1.08); }
        }

        nav {
            flex: 1 1 auto;
            min-width: 0;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 2.35rem;
            align-items: center;
            justify-content: flex-end;
            min-width: 0;
        }

        nav a,
        .nav-label {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.3s;
            position: relative;
            padding: 0.5rem 0;
            display: inline-flex;
            align-items: center;
            line-height: 1;
            white-space: nowrap;
        }

        nav a::after,
        .nav-label::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-blue));
            transition: all 0.3s ease;
            transform: translateX(-50%);
            box-shadow: 0 0 10px var(--accent-cyan);
        }

        nav a:hover,
        .dropdown:hover .nav-label {
            color: var(--text-primary);
        }

        nav a:hover::after,
        nav a.active-nav::after,
        .dropdown:hover .nav-label::after {
            width: 100%;
        }

        nav a.active-nav {
            color: var(--accent-cyan);
        }

        .dropdown {
            position: relative;
        }

        .dropdown-menu {
            display: block;
            opacity: 0;
            visibility: hidden;
            transform: translateY(10px);
            position: absolute;
            top: calc(100% + 15px);
            left: -20px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            min-width: 260px;
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 0.75rem 0;
            transition: all 0.3s ease;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            z-index: 1001;
        }

        .dropdown:hover .dropdown-menu {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .dropdown-menu li {
            padding: 0;
        }

        .dropdown-menu a {
            display: block;
            padding: 0.8rem 1.5rem;
            font-size: 0.86rem;
            color: var(--text-secondary);
        }

        .dropdown-menu a:hover,
        .dropdown-menu a.active-nav {
            color: var(--accent-cyan);
            background: rgba(0, 229, 255, 0.05);
        }

        .nav-label::before {
            content: '▼';
            font-size: 0.5rem;
            margin-right: 6px;
            opacity: 0.6;
            display: inline-block;
            transition: transform 0.3s;
            vertical-align: middle;
        }

        .dropdown:hover .nav-label::before {
            transform: rotate(180deg);
        }

        .menu-toggle {
            display: none;
            width: 48px;
            height: 48px;
            min-width: 48px;
            flex: 0 0 48px;
            border-radius: 12px;
            border: 1px solid rgba(0, 229, 255, 0.18);
            background: rgba(15, 21, 37, 0.88);
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 5px;
            transition: all 0.3s ease;
            box-shadow: 0 0 0 1px rgba(255,255,255,0.03), 0 8px 24px rgba(0,0,0,0.35);
            position: relative;
            z-index: 1102;
            appearance: none;
            -webkit-appearance: none;
            margin-left: auto;
            cursor: pointer;
        }

        .menu-toggle:hover {
            border-color: rgba(0, 229, 255, 0.4);
            box-shadow: 0 0 18px rgba(0, 229, 255, 0.15);
        }

        .menu-toggle span {
            width: 20px;
            height: 2px;
            border-radius: 2px;
            background: var(--text-primary);
            transition: all 0.3s ease;
            display: block;
        }

        .menu-toggle.active span:nth-child(1) {
            transform: translateY(7px) rotate(45deg);
        }

        .menu-toggle.active span:nth-child(2) {
            opacity: 0;
        }

        .menu-toggle.active span:nth-child(3) {
            transform: translateY(-7px) rotate(-45deg);
        }

        .mobile-menu {
            position: fixed;
            top: 88px;
            left: 0;
            right: 0;
            width: 100%;
            max-width: 100vw;
            background: rgba(7, 11, 20, 0.98);
            backdrop-filter: blur(22px);
            border-bottom: 1px solid var(--border-subtle);
            padding: 1rem 1.25rem 1.4rem;
            z-index: 1100;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-15px);
            transition: all 0.3s ease;
            overflow-x: hidden;
        }

        .mobile-menu.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .mobile-menu a {
            display: block;
            text-decoration: none;
            color: var(--text-secondary);
            padding: 0.95rem 0.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 0.95rem;
            transition: all 0.25s ease;
            word-break: break-word;
        }

        .mobile-menu a:hover,
        .mobile-menu a.active-nav {
            color: var(--accent-cyan);
            padding-left: 1rem;
        }

        .mobile-menu-group {
            margin-top: 0.2rem;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 0.35rem;
        }

        .mobile-menu-group-title {
            color: var(--text-primary);
            padding: 0.95rem 0.5rem 0.5rem;
            font-size: 0.95rem;
            font-weight: 600;
        }

        .mobile-sub-link {
            padding-left: 1.15rem !important;
            font-size: 0.9rem !important;
        }

        .mobile-sub-link:hover {
            padding-left: 1.45rem !important;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 0 2rem;
            position: relative;
            z-index: 1;
        }

        main {
            position: relative;
            z-index: 1;
            overflow-x: hidden;
        }

        section {
            padding: 100px 0;
            position: relative;
        }

        .page-hero {
            min-height: 72vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding-top: 150px;
            padding-bottom: 70px;
            position: relative;
            overflow: hidden;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 0.6rem 1.2rem;
            background: rgba(0, 229, 255, 0.08);
            border: 1px solid var(--border-glow);
            border-radius: 100px;
            font-size: 0.8rem;
            font-family: 'JetBrains Mono', monospace;
            color: var(--accent-cyan);
            margin-bottom: 2rem;
            animation: fadeInUp 0.8s ease forwards;
            animation-delay: 0.2s;
            opacity: 0;
            max-width: 100%;
        }

        .hero-badge .pulse {
            width: 8px;
            height: 8px;
            background: var(--accent-cyan);
            border-radius: 50%;
            animation: pulse 2s infinite;
            box-shadow: 0 0 10px var(--accent-cyan);
            flex: 0 0 auto;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.6); }
        }

        .page-hero h1 {
            font-size: clamp(2.6rem, 5vw, 4.4rem);
            line-height: 1.05;
            margin-bottom: 1.5rem;
            font-weight: 800;
            letter-spacing: -2px;
        }

        .page-hero h1 .line {
            display: block;
            overflow: hidden;
        }

        .page-hero h1 .line span {
            display: block;
            transform: translateY(100%);
            position: relative;
            word-break: break-word;
        }

        .hero-shine {
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            background-size: 220% 100%;
            animation: revealText 1s cubic-bezier(0.77, 0, 0.175, 1) forwards, shineRTL 5s linear infinite 1.4s;
        }

        .primary-text {
            background-image: linear-gradient(
                90deg,
                #cfd7e2 0%,
                #ffffff 18%,
                #eaf9ff 34%,
                var(--accent-cyan) 50%,
                #ffffff 66%,
                #d7dee9 100%
            );
        }

        .accent-text {
            background-image: linear-gradient(
                90deg,
                var(--accent-purple) 0%,
                var(--accent-blue) 20%,
                var(--accent-cyan) 42%,
                #ffffff 56%,
                var(--accent-cyan) 70%,
                var(--accent-blue) 86%,
                var(--accent-purple) 100%
            );
        }

        .page-hero h1 .line:nth-child(1) span { animation-delay: 0.4s, 1.7s; }
        .page-hero h1 .line:nth-child(2) span { animation-delay: 0.7s, 1.9s; }

        @keyframes revealText {
            to { transform: translateY(0); }
        }

        @keyframes shineRTL {
            0% { background-position: 200% center; }
            100% { background-position: -200% center; }
        }

        .page-hero p {
            font-size: 1.15rem;
            color: var(--text-secondary);
            max-width: 720px;
            margin: 0 auto 1.5rem;
            line-height: 1.8;
            animation: fadeInUp 0.8s ease forwards;
            animation-delay: 1s;
            opacity: 0;
        }

        .page-hero .hero-meta {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 2.5rem;
            animation: fadeInUp 0.8s ease forwards;
            animation-delay: 1.2s;
            opacity: 0;
            max-width: 100%;
        }

        .page-hero .hero-meta span {
            color: var(--accent-cyan);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hero-buttons {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
            animation: fadeInUp 0.8s ease forwards;
            animation-delay: 1.4s;
            opacity: 0;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 1rem 2rem;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            max-width: 100%;
            text-align: center;
            cursor: pointer;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            color: var(--bg-deep);
            border: none;
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.2);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 50px rgba(0, 229, 255, 0.4);
        }

        .btn-primary::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s;
        }

        .btn-primary:hover::before {
            left: 100%;
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-primary);
            border: 1px solid var(--border-subtle);
        }

        .btn-secondary:hover {
            border-color: var(--accent-cyan);
            background: rgba(0, 229, 255, 0.05);
            transform: translateY(-2px);
        }

        .section-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: var(--accent-cyan);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 12px;
            flex-wrap: wrap;
        }

        .section-label::before {
            content: '';
            width: 30px;
            height: 1px;
            background: var(--accent-cyan);
            box-shadow: 0 0 8px var(--accent-cyan);
            flex: 0 0 auto;
        }

        .section-title {
            font-size: clamp(2rem, 4vw, 3rem);
            margin-bottom: 1rem;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .section-subtitle {
            color: var(--text-secondary);
            font-size: 1.08rem;
            max-width: 700px;
            margin-bottom: 3rem;
            line-height: 1.7;
        }

        .reveal {
            opacity: 0;
            transform: translateY(40px);
            transition: all 0.8s cubic-bezier(0.5, 0, 0, 1);
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        .stats-bar {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 2rem;
            padding: 2.5rem 0;
            border-top: 1px solid var(--border-subtle);
            border-bottom: 1px solid var(--border-subtle);
        }

        .stat-item {
            text-align: center;
            position: relative;
            min-width: 0;
        }

        .stat-item:not(:last-child)::after {
            content: '';
            position: absolute;
            right: -1rem;
            top: 20%;
            height: 60%;
            width: 1px;
            background: var(--border-subtle);
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin-bottom: 0.5rem;
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-family: 'JetBrains Mono', monospace;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        .service-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 2.1rem 1.8rem;
            transition: all 0.3s;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .service-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-cyan), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .service-card:hover {
            border-color: var(--border-glow);
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 229, 255, 0.06);
        }

        .service-card:hover::before {
            opacity: 1;
        }

        .service-icon {
            font-size: 2.2rem;
            margin-bottom: 1.1rem;
            display: block;
        }

        .service-card h4 {
            font-size: 1.15rem;
            margin-bottom: 0.75rem;
            color: var(--text-primary);
            word-break: break-word;
        }

        .service-card > p {
            font-size: 0.95rem;
            color: var(--text-secondary);
            line-height: 1.7;
            margin-bottom: 1.1rem;
        }

        .service-features {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.55rem;
            margin-top: auto;
        }

        .service-features li {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-secondary);
            font-size: 0.88rem;
            word-break: break-word;
        }

        .service-features li::before {
            content: '→';
            color: var(--accent-cyan);
            font-weight: 700;
            flex: 0 0 auto;
        }

        .topic-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 4rem;
            align-items: center;
        }

        .topic-row.reverse {
            direction: rtl;
        }

        .topic-row.reverse > * {
            direction: ltr;
        }

        .topic-content,
        .topic-visual,
        .pipeline-stage > * {
            min-width: 0;
        }

        .topic-content h3 {
